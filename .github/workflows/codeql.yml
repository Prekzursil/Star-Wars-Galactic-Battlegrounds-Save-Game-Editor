name: CodeQL

# Fleet CODEQL DECISION: ADVANCED configuration, owned by THIS repo.
#   queries: security-extended + security-and-quality (strictly subsumes the
#   default suite AND the extended suite), matrix over every language this
#   repo actually has (python), push to main + pull_request targeting main +
#   weekly schedule, upload-sarif to code scanning, category per language.
# The repo's OWN test/coverage suites (verify.yml, quality.yml) stay wired
# beside it and are untouched by this file.
#
# This replaces the QZP reusable-codeql.yml@b4fbe384 call, which ran the
# security-and-quality suite ONLY -- every security-extended query was missing.
# build-mode: none -- this CodeQL CLI supports no other mode for the Python
# extractor ("Python does not support the autobuild build mode").
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    # Key the upload to the PR HEAD commit, not the merge commit: the
    # branch-protection "Code scanning results required" rule expects an
    # analysis for the head SHA (the QZP wrapper this replaced did the same
    # via its explicit `sha:` input; measured on PR #45 -- the upload landed
    # on refs/pull/45/merge and the merge was refused with "Code scanning is
    # still expecting 1 result from CodeQL").
    env:
      GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
