# QZP lean 6-gate quality template -- the workflow pyproject.toml's header
# already declares ("[tool.ruff]/[tool.basedpyright]/[tool.pytest+coverage]
# so the gates run identically locally and in CI (.github/workflows/quality.yml)")
# but that file never existed, so gate 3's 100% line+branch assertion never
# ran in CI. This wires it. Pin is the full commit SHA of the QZP revision
# already proven green elsewhere in the fleet (env-inspector).
name: quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    uses: Prekzursil/quality-zero-platform/.github/workflows/reusable-quality.yml@cc4c6ec12c2b1f204f79414a717e82472e98cb58
    with:
      python-version: "3.12"
