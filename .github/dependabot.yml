version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    github-actions-root-patch-minor:
      patterns:
      - '*'
      update-types:
      - patch
      - minor
  labels:
  - dependencies
  - type:chore
  - area:ci
- package-ecosystem: pre-commit
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    pre-commit-root-patch-minor:
      patterns:
      - '*'
      update-types:
      - patch
      - minor
  labels:
  - dependencies
  - type:chore
  - area:ci
