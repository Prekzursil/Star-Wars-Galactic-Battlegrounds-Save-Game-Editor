version: 2

updates:
# Python rail -- pyproject.toml is the repo's manifest and had NO rail, so
# Dependabot could alert on it and never propose a fix.
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  labels:
  - dependencies
# the workflows themselves
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    github-actions-root-patch-minor:
      patterns:
      - '*'
      update-types:
      - patch
      - minor
  labels:
  - dependencies
  - type:chore
  - area:ci
# the pre-commit hook pins
- package-ecosystem: pre-commit
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    pre-commit-root-patch-minor:
      patterns:
      - '*'
      update-types:
      - patch
      - minor
  labels:
  - dependencies
  - type:chore
  - area:ci
