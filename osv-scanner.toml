# osv-scanner configuration for the lean dependency gate (pinned tool: osv-scanner 2.3.8).
# The QZP lean gate runs `osv-scanner scan source --recursive --config=osv-scanner.toml .`
# with `deps-severity-floor: any`, so every finding of any severity blocks.
#
# This editor is a pure-stdlib Python tool: zero runtime third-party
# dependencies and no committed lockfile/manifest. There is genuinely nothing
# for osv-scanner to scan: it exits 128 ("No package sources found"), which the
# pinned lean gate reports as "nothing to scan" and passes. We do NOT fabricate
# a lockfile of dev tooling to give it something to read. Dependabot
# (.github/dependabot.yml) covers the github-actions half of gate 6.
#
# Add a dated, reasoned [[IgnoredVulns]] entry below only for a future vuln that
# is genuinely unfixable or provably unreachable — we do NOT use a baseline file.
